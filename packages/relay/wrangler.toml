name = "ottie-relay"
main = "src/cloudflare-adapter.ts"
compatibility_date = "2024-12-01"

# Bind to your own subdomain. Cloudflare will auto-issue an HTTPS cert
# the first time `wrangler deploy` runs against this route.
routes = [{ pattern = "relay.claws.company", custom_domain = true }]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDurableObject"]

# Phase 3.b/2b: offline-message inbox. Each entry is a NaCl-box ciphertext
# (≤ 64KB) addressed to a recipient root pubkey, with a 7-day TTL. Senders
# POST blindly; recipients fetch with an Ed25519-signed challenge proving
# control of their root key. Storage is keyed by recipient pubkey; KV is
# eventually consistent across regions but that's fine — recipients
# converge after a brief delay, which is the same property they tolerate
# for live friend-sync.
#
# To create the namespace before the first deploy:
#   pnpm --filter @ottie/relay exec wrangler kv:namespace create OTTIE_INBOX
#   pnpm --filter @ottie/relay exec wrangler kv:namespace create OTTIE_INBOX --preview
# Then paste the returned ids into the `id` and `preview_id` fields below.
[[kv_namespaces]]
binding = "OTTIE_INBOX"
id = "3b4463e4aa3046269131078ab9868955"
preview_id = "43ea9c0612f6440b866e37446aed25f8"
