name = "ottie-relay"
main = "src/cloudflare-adapter.ts"
compatibility_date = "2024-12-01"

# Bind to your own subdomain. Cloudflare will auto-issue an HTTPS cert
# the first time `wrangler deploy` runs against this route.
routes = [{ pattern = "relay.claws.company", custom_domain = true }]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDurableObject"]
