[package]
name = "ottie-desktop"
version = "0.0.1"
edition = "2021"

# TODO: confirm Tauri v2 minor version at install time.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# macOS / Windows vibrancy backdrops — gives the window the macOS 26 "Liquid
# Glass" / Windows 11 mica look. The crate is platform-gated internally so
# linux builds don't pull in the AppKit-specific code paths.
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
hex = "0.4"
# ARCH-03: local-token write-before-spawn (D-15). The Tauri shell creates
# `$OTTIE_HOME/local-token` (mode 0600 on POSIX) before spawning the daemon
# subprocess so the daemon reads it on boot — race-free by ordering.
rand = "0.8"
base64 = "0.22"
dirs = "5"

[[bin]]
name = "ottie-desktop"
path = "src/main.rs"
