[package]
name = "ottie-desktop"
version = "0.0.1"
edition = "2021"

# TODO: confirm Tauri v2 minor version at install time.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "ottie-desktop"
path = "src/main.rs"
