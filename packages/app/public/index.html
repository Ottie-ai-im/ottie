<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* Prevent white flash before React mounts. In Tauri the native
       * window backdrop (NSVisualEffect on macOS, acrylic on Windows)
       * provides the actual chrome, so we keep the document transparent
       * there and only paint a solid color in the regular browser case.
       *
       * The Tauri shell injects `__TAURI_INTERNALS__` early — we use the
       * `:has()` heuristic on the html element via the `data-tauri` attr
       * the bridge sets in bridge.js. As a fallback we still tint via
       * media query for non-Tauri dark Web. */
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #1a1c1b;
        }
      }
      html[data-tauri="true"],
      html[data-tauri="true"] body,
      html[data-tauri="true"] #root {
        background-color: transparent !important;
      }
      /* Under Tauri vibrancy, the macOS/Windows window itself paints the
       * dark gradient backdrop. The React surfaces only need to provide
       * subtle fills; we damp surface0 / sidebar / chat backgrounds via
       * the cascade so the native blur shows through on empty regions. */
      html[data-tauri="true"] [data-vibrancy-pass-through="true"] {
        background-color: transparent !important;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style>
      /* ─── Fonts ────────────────────────────────────────────────────────
       * "Hacker / terminal" aesthetic: JetBrains Mono for Latin, Ark Pixel
       * for CJK. All UI text uses mono — every label / button / message
       * comes out looking like terminal output. Weights are grouped under
       * "JetBrains Mono" so font-weight cascading works on web.
       *
       * Pixel CJK keeps line-height predictable when mixed with mono — they
       * both have hard, vertical-grid character bodies.
       */
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/JetBrainsMono-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/JetBrainsMono-Bold.ttf") format("truetype");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/JetBrainsMono-Italic.ttf") format("truetype");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: italic;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/JetBrainsMono-BoldItalic.ttf") format("truetype");
      }
      @font-face {
        font-family: "Ark Pixel";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/ArkPixel16px.ttf") format("truetype");
      }

      /* App-wide default — macOS/iOS 26 Liquid Glass aesthetic.
       *
       * Chrome (buttons, headers, menus, body copy) uses the system font
       * stack so we inherit SF Pro on Apple platforms and Segoe UI Variable
       * on Windows. Mono is reserved for code-bearing surfaces (agent
       * stream output, terminals, code blocks) — opt in via the `.font-mono`
       * class on a parent or the inline `fontFamily` token from the theme.
       *
       * react-native-web inlines `font-family: System` on every Text/View,
       * which is exactly what we want now — no !important needed.
       */
      html,
      body,
      #root {
        font-family:
          system-ui,
          -apple-system,
          "SF Pro Text",
          "SF Pro",
          BlinkMacSystemFont,
          "Segoe UI Variable",
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        font-feature-settings: "ss01", "cv11";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Mono opt-in: agents wrap their output in a parent that sets this
       * class (or React Native sets `fontFamily: theme.fontFamily.mono`
       * directly). Ark Pixel is kept FIRST so CJK keeps the pixel grid
       * for sources that explicitly want the legacy look. */
      .font-mono,
      .font-mono * {
        font-family:
          "JetBrains Mono", "Ark Pixel", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important;
        font-feature-settings: "calt", "ss01", "ss02", "ss03", "ss19", "ss20", "zero";
      }

      /* Root font-size — 16px is the native PPEM for Ark Pixel and the
       * default we use for system text. */
      html {
        font-size: 16px;
      }

      button,
      a,
      input,
      textarea,
      select,
      [role="button"],
      [role="link"],
      [role="textbox"],
      [role="combobox"],
      [role="tab"],
      [role="switch"],
      [role="checkbox"],
      [role="slider"],
      [role="menuitem"],
      [tabindex],
      [contenteditable="true"] {
        -webkit-app-region: no-drag !important;
      }

      /* Suppress the browser's default focus outline — it appears on mouse
         clicks and looks out of place against our themed surfaces. Keep a
         themed ring for keyboard users via :focus-visible. */
      *:focus {
        outline: none;
      }
      *:focus-visible {
        outline: 2px solid #20744a;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
