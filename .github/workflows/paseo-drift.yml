name: Paseo upstream drift check

# Runs once a week and on demand. Compares every file tracked under
# .paseo-sync/manifest/ against paseo/main and opens (or updates) a single
# tracking issue if drift is detected.
#
# A drift report means one of:
#   - Upstream Paseo fixed a bug in a file we declared "shared". We should
#     pull it via .paseo-sync/scripts/sync-from-upstream.sh.
#   - Someone edited a shared file locally without updating the manifest.
#     Either revert the change or move the file to diverged.tsv.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add paseo remote
        run: |
          git remote add paseo https://github.com/getpaseo/paseo.git
          git fetch --depth=1 paseo main

      - name: Run drift check
        id: drift
        run: |
          set +e
          .paseo-sync/scripts/check-drift.sh > drift.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<EOF'
            cat drift.log
            echo EOF
          } >> "$GITHUB_OUTPUT"
          cat drift.log

      - name: Open or update drift issue
        if: steps.drift.outputs.exit_code != '0'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.drift.outputs.report }}
        with:
          script: |
            const title = "Paseo upstream drift detected";
            const body = [
              "Weekly drift check found differences between local files and `paseo/main`.",
              "",
              "**Fix:**",
              "```bash",
              "git fetch paseo main",
              ".paseo-sync/scripts/sync-from-upstream.sh --dry-run",
              ".paseo-sync/scripts/sync-from-upstream.sh",
              "npm run typecheck && npm run lint",
              "git add -p && git commit -m 'chore: sync from paseo/main'",
              "```",
              "",
              "If a drifted file should no longer track upstream, move it out",
              "of `manifest/identical.txt` / `renamed-content.txt` / `renamed-paths.tsv`",
              "into `manifest/diverged.tsv`.",
              "",
              "<details><summary>Drift report</summary>",
              "",
              "```",
              process.env.REPORT || "(empty)",
              "```",
              "</details>",
            ].join("\n");

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "paseo-sync",
              per_page: 1,
            });

            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
              core.notice(`updated existing issue #${existing[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["paseo-sync"],
              });
              core.notice(`opened issue #${created.number}`);
            }

      - name: Close drift issue when clean
        if: steps.drift.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "paseo-sync",
              per_page: 1,
            });
            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                state: "closed",
                state_reason: "completed",
              });
              core.notice(`closed issue #${existing[0].number} (no drift)`);
            }
