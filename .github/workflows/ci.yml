name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Format check
        run: npx oxfmt --check .

      - name: Lint
        run: npm run lint

      - name: Build highlight
        run: npm run build --workspace=@ottie/highlight

      - name: Build relay
        run: npm run build --workspace=@ottie/relay

      - name: Build server
        run: npm run build --workspace=@ottie/server

      - name: Typecheck
        run: npm run typecheck
